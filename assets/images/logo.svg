<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#gymBg)"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-dasharray="8 6"/>
  
  <!-- Powerful Athletic 'A' & Barbell Plate Monogram -->
  <polygon points="250,110 325,270 290,270 270,225 230,225 210,270 175,270" fill="url(#neonGrad)"/>
  <polygon points="250,160 262,200 238,200" fill="#090D16"/>
  
  <!-- Barbell Wings -->
  <rect x="135" y="240" width="230" height="12" rx="6" fill="url(#neonGrad)" opacity="0.4"/>
  <rect x="110" y="222" width="20" height="48" rx="4" fill="url(#neonGrad)"/>
  <rect x="370" y="222" width="20" height="48" rx="4" fill="url(#neonGrad)"/>
  
  <text x="250" y="375" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="8" text-anchor="middle">ANDROGEN</text>
  <text x="250" y="415" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#00F59B" letter-spacing="7" text-anchor="middle">THE FITNESS STUDIO &bull; KOLKATA</text>
</svg>